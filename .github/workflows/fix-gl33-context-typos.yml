name: Fix GL context patch typos

on:
  push:
    branches:
      - feature/librashader-runtime

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/librashader-runtime

      - name: Fix generated typos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Engine/gfx/ali3dogl.cpp')
          text = path.read_text()
          text = text.replace('legacy OpenGL 6.1 without external shaders', 'legacy OpenGL 2.1 without external shaders')
          text = text.replace('kDrgMsg_Error', 'kDbgMsg_Error')
          path.write_text(text)
          PY
          git diff --check
          git diff -- Engine/gfx/ali3dogl.cpp

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- Engine/gfx/ali3dogl.cpp; then
            echo 'No typo fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Engine/gfx/ali3dogl.cpp
          git commit -m 'Fix shader OpenGL fallback diagnostics'
          git push origin HEAD:feature/librashader-runtime
