name: Apply librashader fallback fix

on:
  push:
    branches:
      - feature/librashader-runtime
    paths:
      - .github/workflows/apply-librashader-fallback-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/librashader-runtime

      - name: Apply guarded source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          header = Path("Engine/gfx/ali3dogl.h")
          source = Path("Engine/gfx/ali3dogl.cpp")

          replace_once(
              header,
              "    AGSShaderPipeline _shaderPipeline;\n",
              "    AGSShaderPipeline _shaderPipeline;\n"
              "    // True only when the current context was created through the\n"
              "    // shader-requested OpenGL 3.3 path. A 2.1 fallback must not\n"
              "    // subsequently try to initialize librashader.\n"
              "    bool _externalShaderContextReady = false;\n",
          )

          replace_once(
              source,
              '''    if (shader_path && shader_path[0] != '\\0')
    {
        std::string shader_error;
        if (!_shaderPipeline.Load(shader_path, shader_error))
            Debug::Printf(kDbgMsg_Warn, "OGL: shader load failed: %s", shader_error.c_str());
        else
            Debug::Printf(kDbgMsg_Info, "OGL: loaded shader pipeline: %s", shader_path);
    }
''',
              '''    if (shader_path && shader_path[0] != '\\0')
    {
#if AGS_PLATFORM_OS_LINUX && !AGS_OPENGL_ES2
        if (!_externalShaderContextReady)
        {
            Debug::Printf(kDbgMsg_Warn,
                "OGL: external shader disabled because OpenGL 3.3 compatibility context is unavailable");
        }
        else
#endif
        {
            std::string shader_error;
            if (!_shaderPipeline.Load(shader_path, shader_error))
                Debug::Printf(kDbgMsg_Warn, "OGL: shader load failed: %s", shader_error.c_str());
            else
                Debug::Printf(kDbgMsg_Info, "OGL: loaded shader pipeline: %s", shader_path);
        }
    }
''',
          )

          replace_once(
              source,
              '''bool OGLGraphicsDriver::CreateWindowAndGlContext(const DisplayMode &mode)
{
  // First setup GL attributes before creating SDL GL window.
''',
              '''bool OGLGraphicsDriver::CreateWindowAndGlContext(const DisplayMode &mode)
{
  _externalShaderContextReady = false;

  // First setup GL attributes before creating SDL GL window.
''',
          )

          replace_once(
              source,
              '''#endif
  _sdlWindow = sdl_window;
  _sdlGlContext = sdlgl_ctx;
#if AGS_PLATFORM_OS_IOS
''',
              '''#endif
#if AGS_PLATFORM_OS_LINUX && !AGS_OPENGL_ES2
  _externalShaderContextReady = shader_gl33_requested;
#endif
  _sdlWindow = sdl_window;
  _sdlGlContext = sdlgl_ctx;
#if AGS_PLATFORM_OS_IOS
''',
          )

          replace_once(
              source,
              '''void OGLGraphicsDriver::DeleteWindowAndGlContext()
{
  SDL_GL_MakeCurrent(nullptr, nullptr);
''',
              '''void OGLGraphicsDriver::DeleteWindowAndGlContext()
{
  _externalShaderContextReady = false;
  SDL_GL_MakeCurrent(nullptr, nullptr);
''',
          )

          # This workflow is intentionally one-shot; remove it from the resulting tree.
          Path(".github/workflows/apply-librashader-fallback-fix.yml").unlink()

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Engine/gfx/ali3dogl.h Engine/gfx/ali3dogl.cpp .github/workflows/apply-librashader-fallback-fix.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: disable librashader after OpenGL fallback'
          git push origin HEAD:feature/librashader-runtime
