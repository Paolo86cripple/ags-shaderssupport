name: Apply librashader review fixes

on:
  push:
    branches:
      - feature/librashader-runtime

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/librashader-runtime
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply.py
          python3 /tmp/apply.py
          git diff --check
          git status --short

      - name: Commit reviewed fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Engine/gfx/ags_shader_pipeline.cpp Engine/gfx/README-SHADERS.md .github/workflows/librashader-runtime-smoke.yml
          git commit -m 'Apply librashader review fixes'
          git push origin HEAD:feature/librashader-runtime
