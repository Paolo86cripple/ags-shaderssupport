name: Repair Engine CMake source list

on:
  push:
    branches: [ feature/librashader-runtime ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/librashader-runtime

      - name: Restore omitted AGS core sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Engine/CMakeLists.txt')
          text = path.read_text()

          additions = [
              (
                  '    ac/dynobj/dynobj_manager.h\n',
                  '    ac/dynobj/managedobjectpool.cpp\n    ac/dynobj/managedobjectpool.h\n',
                  'ac/dynobj/managedobjectpool.cpp',
              ),
              (
                  '    ac/global_region.h\n',
                  '    ac/global_room.cpp\n    ac/global_room.h\n',
                  'ac/global_room.cpp',
              ),
          ]

          for anchor, insert, marker in additions:
              if marker in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f'Expected CMake anchor not found: {anchor.strip()}')
              text = text.replace(anchor, anchor + insert, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- Engine/CMakeLists.txt

      - name: Commit source-list repair
        shell: bash
        run: |
          if git diff --quiet -- Engine/CMakeLists.txt; then
            echo 'Engine/CMakeLists.txt already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Engine/CMakeLists.txt
          git commit -m 'Fix omitted AGS core sources in CMake'
          git push origin HEAD:feature/librashader-runtime
