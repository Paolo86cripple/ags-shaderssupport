name: Librashader first-frame FBO probe

on:
  push:
    branches:
      - feature/librashader-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-linux:
    name: Probe first-frame framebuffer state
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout AGS branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Apply first-frame framebuffer-state probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Engine/gfx/ags_shader_pipeline.cpp")
          source = path.read_text()
          needle = """    const libra_image_gl_t input = {\n"""
          replacement = """    // Ensure one-time render-target creation does not leak the caller-owned\n    // output FBO into librashader's first frame. Existing targets do not bind\n    // this FBO, so without this restore the first frame has unique GL state.\n    _impl->RestoreHostGLState(host_state);\n\n    if (_impl->frame_count == 0)\n    {\n        std::fprintf(stderr,\n                     \"AGS librashader probe: entering first frame; host draw/read FBO=%d/%d, output FBO=%u\\n\",\n                     host_state.draw_fbo, host_state.read_fbo, _impl->output_fbo);\n    }\n\n    const libra_image_gl_t input = {\n"""
          if source.count(needle) != 1:
              raise SystemExit("expected exactly one librashader frame input marker")
          source = source.replace(needle, replacement, 1)

          needle2 = """    if (!libra_error)\n    {\n"""
          replacement2 = """    if (_impl->frame_count == 1)\n    {\n        std::fprintf(stderr, \"AGS librashader probe: first frame returned\\n\");\n    }\n\n    if (!libra_error)\n    {\n"""
          if source.count(needle2) != 1:
              raise SystemExit("expected exactly one librashader frame result marker")
          source = source.replace(needle2, replacement2, 1)
          path.write_text(source)
          PY

          git diff --check
          git diff -- Engine/gfx/ags_shader_pipeline.cpp

      - name: Install AGS and headless OpenGL dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake g++ git pkg-config python3-pip curl unzip \
            xvfb xauth mesa-utils libgl1-mesa-dri \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libusb-1.0-0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev

      - name: Configure AGS
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAGS_BUILD_TOOLS=OFF \
            -DAGS_TESTS=OFF \
            -DAGS_BUILTIN_PLUGINS=OFF \
            -DSDL_PIPEWIRE=OFF

      - name: Build AGS
        run: cmake --build build --config Release --parallel 4

      - name: Build librashader 0.12.0 OpenGL C API baseline
        shell: bash
        run: |
          git clone --depth 1 --branch librashader-v0.12.0 \
            https://github.com/SnowflakePowered/librashader.git /tmp/librashader
          cd /tmp/librashader
          cargo build \
            --package librashader-capi \
            --release \
            --no-default-features \
            --features runtime-opengl
          cp target/release/liblibrashader_capi.so target/release/librashader.so.2
          ln -sf librashader.so.2 target/release/librashader.so

      - name: Stage test game and shader
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/ags3-auto-test.zip \
            https://github.com/adventuregamestudio/ags-test-games/releases/download/v0.5.11/ags3-auto-test.zip
          echo '9ba43e2e3f0b1b7e799f56117e43c9763b22f95c58654b39dfd98825f3f5bb18  /tmp/ags3-auto-test.zip' | sha256sum --check --strict
          mkdir -p test-game smoke-shader
          unzip -q /tmp/ags3-auto-test.zip -d test-game
          GAME_FILE="$(find test-game -type f -name '*.ags' -print -quit)"
          test -n "$GAME_FILE"
          printf 'GAME_FILE=%s\n' "$GAME_FILE" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            --output smoke-shader/bilinear.slangp \
            https://raw.githubusercontent.com/libretro/slang-shaders/4812a82f6c9a11cc8b5a7447040a98c9fc80c00e/bilinear.slangp
          curl --fail --location --retry 3 \
            --output smoke-shader/stock.slang \
            https://raw.githubusercontent.com/libretro/slang-shaders/4812a82f6c9a11cc8b5a7447040a98c9fc80c00e/stock.slang

      - name: Run patched first-frame probe
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runtime-home runtime-user runtime-xdg
          chmod 700 runtime-xdg
          export HOME="$PWD/runtime-home"
          export XDG_RUNTIME_DIR="$PWD/runtime-xdg"
          export SDL_AUDIODRIVER=dummy
          export LIBGL_ALWAYS_SOFTWARE=1
          export LD_LIBRARY_PATH="/tmp/librashader/target/release${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export AGS_SHADER_CHAIN="$PWD/smoke-shader/bilinear.slangp"

          timeout 90s xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
            ./build/ags \
              --no-message-box \
              --windowed \
              --gfxdriver ogl \
              --log-stdout=all:info \
              --user-data-dir "$PWD/runtime-user" \
              "$GAME_FILE" 2>&1 | tee first-frame-probe.log

          grep -F 'AGS librashader probe: entering first frame' first-frame-probe.log
          grep -F 'AGS librashader probe: first frame returned' first-frame-probe.log
          TAP_FILE="$(find . -type f -name 'agstest.tap' -print -quit)"
          test -n "$TAP_FILE"
          test -s "$TAP_FILE"

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: librashader-first-frame-probe
          path: |
            first-frame-probe.log
            **/agstest.tap
          if-no-files-found: warn
