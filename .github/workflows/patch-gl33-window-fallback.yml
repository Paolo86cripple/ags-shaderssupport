name: Harden OpenGL 3.3 window fallback

on:
  push:
    branches:
      - feature/librashader-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/librashader-runtime

      - name: Add window-creation fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Engine/gfx/ali3dogl.cpp')
          text = path.read_text()
          marker = '  SDL_Window *sdl_window = sys_window_create("", mode.DisplayIndex, mode.Width, mode.Height, mode.Mode, SDL_WINDOW_OPENGL);\n'
          sentinel = 'OGL: OpenGL 3.3 window creation failed'
          if sentinel not in text:
              if marker not in text:
                  raise SystemExit('SDL OpenGL window creation marker not found')
              insert = (
                  '#if AGS_PLATFORM_OS_LINUX && !AGS_OPENGL_ES2\n'
                  '  if (!sdl_window && shader_gl33_requested)\n'
                  '  {\n'
                  '    Debug::Printf(kDbgMsg_Warn,\n'
                  '      "OGL: OpenGL 3.3 window creation failed (%s); retrying legacy OpenGL 2.1 without external shaders",\n'
                  '      SDL_GetError());\n'
                  '    set_gl_context_version(2, 1);\n'
                  '    shader_gl33_requested = false;\n'
                  '    sdl_window = sys_window_create("", mode.DisplayIndex, mode.Width, mode.Height, mode.Mode, SDL_WINDOW_OPENGL);\n'
                  '  }\n'
                  '#endif\n'
              )
              text = text.replace(marker, marker + insert, 1)

          old = (
              '    sdl_window = nullptr;\n'
              '    set_gl_context_version(2, 1);\n\n'
              '    sdl_window = sys_window_create("", mode.DisplayIndex, mode.Width, mode.Height, mode.Mode, SDL_WINDOW_OPENGL);\n'
          )
          new = (
              '    sdl_window = nullptr;\n'
              '    set_gl_context_version(2, 1);\n'
              '    shader_gl33_requested = false;\n\n'
              '    sdl_window = sys_window_create("", mode.DisplayIndex, mode.Width, mode.Height, mode.Mode, SDL_WINDOW_OPENGL);\n'
          )
          if 'set_gl_context_version(2, 1);\n    shader_gl33_requested = false;\n\n    sdl_window = sys_window_create' not in text:
              if old not in text:
                  raise SystemExit('OpenGL context fallback marker not found')
              text = text.replace(old, new, 1)

          text = text.replace('Development bootstrap for the native Libretro-compatible shader pipeline.',
                              'Development bootstrap for the native librashader pipeline.')
          path.write_text(text)
          PY
          git diff --check
          git diff -- Engine/gfx/ali3dogl.cpp

      - name: Commit fallback hardening
        shell: bash
        run: |
          if git diff --quiet -- Engine/gfx/ali3dogl.cpp; then
            echo 'OpenGL fallback already hardened.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Engine/gfx/ali3dogl.cpp
          git commit -m 'Harden shader OpenGL 3.3 fallback to legacy 2.1'
          git push origin HEAD:feature/librashader-runtime
